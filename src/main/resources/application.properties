# ==============================================================================
# CONEXIÓN A BASE DE DATOS POSTGRESQL (SUPABASE)
# ==============================================================================
# Parámetros clave en la URL:
# - sslmode=require: Cifra la conexión obligatoriamente.
# - prepareThreshold=0: DESACTIVA sentencias preparadas en el servidor (IMPRESCINDIBLE en PgBouncer puerto 6543 Transaction mode).
# - reWriteBatchedInserts=true: Optimiza batch inserts reescribiendo múltiples inserts en un solo INSERT multi-row.
# - tcpKeepAlive=true: Evita que firewalls o NAT intermedias cierren sockets inactivos.
# - connectTimeout=10 / socketTimeout=30: Limita el tiempo de espera en caso de corte de red.
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&reWriteBatchedInserts=true&tcpKeepAlive=true&connectTimeout=10&socketTimeout=30
spring.datasource.username=postgres.lakwppzkqyoymaakghuz
spring.datasource.password=LautaroRocco
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# CONFIGURACIÓN ÓPTIMA DE HIKARICP (REDUCCIÓN DE LATENCIA EN LA NUBE)
# ==============================================================================
spring.datasource.hikari.pool-name=GestorCasosHikariPool

# Tamaño del Pool: En desarrollo/nube remota, mantenerlo acotado evita saturar los límites de conexión de Supabase.
spring.datasource.hikari.maximum-pool-size=5
# Conexiones mínimas en reposo listas para atender peticiones sin esperar handshake TCP/SSL.
spring.datasource.hikari.minimum-idle=2

# Keepalive (30s): Envía un "ping" periódico para evitar que routers/NAT de AWS o Supabase descarten la conexión por inactividad.
spring.datasource.hikari.keepalive-time=30000

# Connection Timeout (20s): Tiempo máximo que espera un hilo para obtener una conexión del pool antes de lanzar excepción.
spring.datasource.hikari.connection-timeout=20000

# Idle Timeout (5 min): Tiempo máximo que una conexión excedente de minimum-idle puede permanecer inactiva antes de liberarse.
spring.datasource.hikari.idle-timeout=300000

# Max Lifetime (10 min): Vida útil máxima de una conexión. DEBE ser menor al server_idle_timeout de PgBouncer (usualmente 10-15m) para evitar desconexiones inesperadas por el servidor.
spring.datasource.hikari.max-lifetime=600000

# Validation Timeout (3s): Tiempo para validar si una conexión sigue viva al tomarla del pool.
spring.datasource.hikari.validation-timeout=3000

# Detección de Fugas (2s): Advierte en logs con stack trace si un request retiene una conexión más de 2000ms sin cerrarla.
spring.datasource.hikari.leak-detection-threshold=2000

# ==============================================================================
# DIAGNÓSTICO Y LOGS DE CONSULTAS (TIEMPOS DE RESPUESTA Y CONSULTAS N+1)
# ==============================================================================
# Registra cada SQL ejecutado por ActiveJDBC indicando milisegundos exactos consumidos
logging.level.org.javalite.activejdbc=DEBUG
# Registra el estado del pool HikariCP (activas, libres, hilos en espera)
logging.level.com.zaxxer.hikari=DEBUG

# ==============================================================================
# MOTOR DE PLANTILLAS Y DEVTOOLS
# ==============================================================================
spring.mustache.cache=false
spring.mustache.default-value=
spring.devtools.restart.exclude=templates/**,static/**